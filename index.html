<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 FireStore - Marketplace com Quantidade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #0a0f18;
            color: #e0e6f0;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(145deg, #151f2e, #0a111c);
            padding: 14px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a3a4f;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: #f5a623;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #ff6b6b;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .cart-btn {
            background: #1f2d3f;
            border: none;
            color: #fff;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #33455c;
        }

        .cart-btn:hover {
            background: #2f4057;
            transform: scale(1.02);
        }

        .cart-badge {
            background: #f5a623;
            color: #0a0f18;
            border-radius: 50%;
            padding: 2px 10px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #151f2e;
            padding: 6px 16px 6px 10px;
            border-radius: 40px;
            border: 1px solid #2a3a4f;
        }

        .avatar {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #f5a623, #d48c1a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            color: #0a0f18;
        }

        .user-name {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .main {
            padding: 24px 32px;
            max-width: 1440px;
            margin: 0 auto;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            background: #111b28;
            padding: 14px 24px;
            border-radius: 60px;
            border: 1px solid #1f2d3f;
        }

        .stats-bar .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #8a9bb0;
        }

        .stats-bar .stat strong {
            color: #f5a623;
            font-weight: 700;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 28px;
            background: #111b28;
            padding: 14px 22px;
            border-radius: 60px;
            border: 1px solid #1f2d3f;
            align-items: center;
        }

        .filters .filter-label {
            font-weight: 600;
            color: #8a9bb0;
            margin-right: 4px;
            font-size: 0.85rem;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid #1f2d3f;
            color: #b0c0d0;
            padding: 6px 16px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .filter-btn:hover {
            background: #1f2d3f;
            color: #fff;
        }

        .filter-btn.active {
            background: #f5a623;
            border-color: #f5a623;
            color: #0a0f18;
            font-weight: 700;
        }

        .search-box {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        .search-box input {
            background: #0a111c;
            border: 1px solid #1f2d3f;
            padding: 8px 18px;
            border-radius: 40px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            width: 200px;
            transition: 0.2s;
        }

        .search-box input:focus {
            border-color: #f5a623;
            box-shadow: 0 0 20px #f5a62322;
        }

        .search-box button {
            background: #f5a623;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 700;
            color: #0a0f18;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-box button:hover {
            filter: brightness(1.1);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: linear-gradient(145deg, #151f2e, #0e1724);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #1f2d3f;
            transition: 0.3s;
            cursor: default;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #f5a62366;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }

        .product-img {
            height: 140px;
            background: #0a111c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.4rem;
            border-bottom: 1px solid #1a2636;
            position: relative;
        }

        .product-img .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #f5a623;
            color: #0a0f18;
            padding: 2px 12px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.65rem;
            text-transform: uppercase;
        }

        .product-img .badge.special {
            background: #ff6b6b;
            color: #fff;
        }

        .product-img .badge.rare {
            background: #6c5ce7;
            color: #fff;
        }

        .product-info {
            padding: 14px 16px 16px;
        }

        .product-name {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .product-category {
            font-size: 0.7rem;
            color: #8a9bb0;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f5a623;
            margin: 6px 0 8px;
        }

        .product-price small {
            font-size: 0.75rem;
            color: #5a6a7a;
            font-weight: 400;
            text-decoration: line-through;
            margin-left: 8px;
        }

        .product-stock {
            font-size: 0.7rem;
            color: #4caf50;
            margin-bottom: 8px;
        }

        .product-stock.low {
            color: #ff6b6b;
        }

        .product-stock.out {
            color: #5a6a7a;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0 10px;
            background: #0a111c;
            padding: 4px 8px;
            border-radius: 40px;
            border: 1px solid #1f2d3f;
            width: fit-content;
        }

        .quantity-control button {
            background: transparent;
            border: none;
            color: #b0c0d0;
            font-size: 1.2rem;
            font-weight: 700;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quantity-control button:hover {
            background: #1f2d3f;
            color: #f5a623;
        }

        .quantity-control .qty-value {
            min-width: 28px;
            text-align: center;
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
        }

        .add-to-cart {
            width: 100%;
            padding: 9px;
            border: none;
            border-radius: 40px;
            background: #f5a623;
            color: #0a0f18;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-to-cart:hover {
            filter: brightness(1.1);
            transform: scale(0.98);
        }

        .add-to-cart.in-cart {
            background: #1f2d3f;
            color: #8a9bb0;
        }

        .add-to-cart:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .product-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            color: #ffd966;
            margin-bottom: 4px;
        }

        .product-rating span {
            color: #5a6a7a;
            margin-left: 4px;
        }

        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -440px;
            width: 420px;
            height: 100vh;
            background: #0e1724;
            border-left: 1px solid #1f2d3f;
            transition: 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 200;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 50px rgba(0, 0, 0, 0.8);
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid #1f2d3f;
        }

        .cart-header h2 {
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-close {
            background: none;
            border: none;
            color: #8a9bb0;
            font-size: 1.8rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .cart-close:hover {
            color: #fff;
            transform: rotate(90deg);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 14px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0a111c;
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid #1a2636;
        }

        .cart-item-info {
            display: flex;
            flex-direction: column;
        }

        .cart-item-name {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .cart-item-detail {
            display: flex;
            gap: 12px;
            font-size: 0.8rem;
            color: #8a9bb0;
        }

        .cart-item-price {
            color: #f5a623;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .cart-item-remove {
            background: none;
            border: none;
            color: #ff6b6b;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 6px;
            transition: 0.2s;
        }

        .cart-item-remove:hover {
            transform: scale(1.2);
        }

        .cart-footer {
            border-top: 1px solid #1f2d3f;
            padding-top: 14px;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .cart-total .total-value {
            color: #f5a623;
        }

        .checkout-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(145deg, #f5a623, #d48c1a);
            color: #0a0f18;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .checkout-btn:hover {
            filter: brightness(1.1);
            transform: scale(0.98);
        }

        .checkout-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .cart-empty {
            text-align: center;
            color: #5a6a7a;
            padding: 40px 0;
            font-size: 1rem;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #151f2e;
            padding: 12px 30px;
            border-radius: 60px;
            border: 1px solid #f5a62355;
            color: #fff;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 300;
            pointer-events: none;
            font-size: 0.95rem;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast strong {
            color: #f5a623;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
            }

            .logo {
                font-size: 1.3rem;
            }

            .main {
                padding: 16px;
            }

            .filters {
                border-radius: 20px;
                padding: 12px 16px;
                gap: 6px;
            }

            .search-box {
                margin-left: 0;
                width: 100%;
            }

            .search-box input {
                width: 100%;
            }

            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 14px;
            }

            .cart-sidebar {
                width: 100%;
                right: -100%;
            }

            .user-name {
                display: none;
            }

            .stats-bar {
                border-radius: 20px;
                padding: 10px 16px;
                gap: 10px;
                flex-wrap: wrap;
            }

            .quantity-control {
                padding: 2px 6px;
            }

            .quantity-control button {
                width: 24px;
                height: 24px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .product-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .product-img {
                height: 100px;
                font-size: 2.4rem;
            }

            .product-info {
                padding: 10px 12px;
            }

            .product-price {
                font-size: 1rem;
            }

            .filters {
                flex-wrap: wrap;
            }

            .quantity-control {
                margin: 4px 0 8px;
            }
        }
    </style>
</head>

            { id: 33, name: "Jet Ski", category: "veiculos", price: 189.90, rating: 4.2, emoji: "🛥️", stock: 8 },

            // MOCHILAS
            { id: 34, name: "Mochila Grande", category: "mochilas", price: 79.90, rating: 4.6, emoji: "🎒", stock: 18 },
            { id: 35, name: "Mochila Militar", category: "mochilas", price: 119.90, rating: 4.8, emoji: "🎒", badge: "Popular", stock: 14 },
            { id: 36, name: "Mochila de Camping", category: "mochilas", price: 59.90, rating: 4.3, emoji: "🎒", stock: 22 },

            // MUNIÇÃO
            { id: 37, name: "Pacote Munição 5.56", category: "municao", price: 29.90, rating: 4.2, emoji: "📦", stock: 50 },
            { id: 38, name: "Pacote Munição .50", category: "municao", price: 39.90, rating: 4.4, emoji: "📦", stock: 40 },
            { id: 39, name: "Pacote Munição 9mm", category: "municao", price: 19.90, rating: 4.0, emoji: "📦", stock: 60 },
            { id: 40, name: "Caixa de Munição 12g", category: "municao", price: 49.90, rating: 4.3, emoji: "📦", stock: 30 },
            { id: 41, name: "Kit Recarga Sniper", category: "municao", price: 59.90, rating: 4.6, emoji: "📦", badge: "Especial", stock: 20 },
        ];

        // --- STATE ---
        let cart = []; // each item: { id, name, price, emoji, quantity, maxStock }
        let currentFilter = 'all';
        let searchTerm = '';

        // --- DOM REFS ---
        const grid = document.getElementById('productGrid');
        const cartItems = document.getElementById('cartItems');
        const cartTotal = document.getElementById('cartTotal');
        const cartCount = document.getElementById('cartCount');
        const cartItemsCountStat = document.getElementById('cartItemsCount');
        const cartSidebar = document.getElementById('cartSidebar');
        const overlay = document.getElementById('overlay');
        const cartToggle = document.getElementById('cartToggle');
        const cartClose = document.getElementById('cartClose');
        const checkoutBtn = document.getElementById('checkoutBtn');
        const toast = document.getElementById('toast');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const totalProductsSpan = document.getElementById('totalProducts');
        const totalCategoriesSpan = document.getElementById('totalCategories');
        const avgRatingSpan = document.getElementById('avgRating');

        // --- RENDER PRODUCTS ---
        function renderProducts() {
            const filtered = products.filter(p => {
                const matchCategory = currentFilter === 'all' || p.category === currentFilter;
                const matchSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    p.category.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    p.emoji.includes(searchTerm);
                return matchCategory && matchSearch;
            });

            // Update stats
            totalProductsSpan.textContent = products.length;
            const categories = new Set(products.map(p => p.category));
            totalCategoriesSpan.textContent = categories.size;
            const avg = products.reduce((s, p) => s + p.rating, 0) / products.length;
            avgRatingSpan.textContent = avg.toFixed(1);

            const totalCartItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartItemsCountStat.textContent = totalCartItems;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:#5a6a7a;">
                        <div style="font-size:3rem; margin-bottom:12px;">🔍</div>
                        <h3>Nenhum equipamento encontrado</h3>
                        <p style="font-size:0.9rem;">Tente ajustar os filtros ou a busca</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const cartItem = cart.find(item => item.id === p.id);
                const inCart = !!cartItem;
                const qtyInCart = cartItem ? cartItem.quantity : 0;
                const stockClass = p.stock < 5 ? 'low' : '';
                const outOfStock = p.stock === 0;

                return `
                    <div class="product-card" data-id="${p.id}">
                        <div class="product-img">
                            ${p.emoji}
                            ${p.badge ? `<span class="badge ${p.badge === 'Lendário' || p.badge === 'Especial' ? 'special' : ''}">${p.badge}</span>` : ''}
                        </div>
                        <div class="product-info">
                            <div class="product-name">${p.name}</div>
                            <div class="product-category">${p.category}</div>
                            <div class="product-rating">
                                ${'★'.repeat(Math.floor(p.rating))}${p.rating % 1 >= 0.5 ? '½' : ''}
                                <span>(${p.rating})</span>
                            </div>
                            <div class="product-stock ${stockClass} ${outOfStock ? 'out' : ''}">
                                ${outOfStock ? '❌ Esgotado' : `📦 ${p.stock} em estoque`}
                            </div>
                            <div class="product-price">
                                R$ ${p.price.toFixed(2)}
                                ${p.price > 150 ? `<small>R$ ${(p.price * 0.85).toFixed(2)}</small>` : ''}
                            </div>
                            ${!outOfStock ? `
                                <div class="quantity-control">
                                    <button class="qty-dec" data-id="${p.id}">−</button>
                                    <span class="qty-value" data-id="${p.id}">${inCart ? qtyInCart : 1}</span>
                                    <button class="qty-inc" data-id="${p.id}">+</button>
                                </div>
                            ` : ''}
                            <button class="add-to-cart ${inCart ? 'in-cart' : ''}" data-id="${p.id}" ${outOfStock ? 'disabled' : ''}>
                                ${outOfStock ? '❌ Esgotado' : inCart ? `✅ ${qtyInCart} no carrinho` : '🛒 Adicionar'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            // --- Quantity controls ---
            document.querySelectorAll('.qty-inc').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    const product = products.find(p => p.id === id);
                    if (!product) return;
                    const qtySpan = document.querySelector(`.qty-value[data-id="${id}"]`);
                    let current = parseInt(qtySpan.textContent);
                    const cartItem = cart.find(item => item.id === id);
                    const inCartQty = cartItem ? cartItem.quantity : 0;
                    const maxAllowed = product.stock - inCartQty;
                    if (current < maxAllowed && current < product.stock) {
                        current++;
                        qtySpan.textContent = current;
                    } else {
                        showToast(`⚠️ Estoque máximo disponível: ${product.stock - inCartQty}`);
                    }
                });
            });

            document.querySelectorAll('.qty-dec').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    const qtySpan = document.querySelector(`.qty-value[data-id="${id}"]`);
                    let current = parseInt(qtySpan.textContent);
                    if (current > 1) {
                        current--;
                        qtySpan.textContent = current;
                    }
                });
            });

            // --- Add to cart ---
            document.querySelectorAll('.add-to-cart').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    const product = products.find(p => p.id === id);
                    if (!product || product.stock === 0) return;

                    const qtySpan = document.querySelector(`.qty-value[data-id="${id}"]`);
                    let qty = qtySpan ? parseInt(qtySpan.textContent) : 1;

                    const existing = cart.find(item => item.id === id);
                    const inCartQty = existing ? existing.quantity : 0;

                    if (qty <= 0) qty = 1;

                    if (inCartQty + qty > product.stock) {
                        showToast(`⚠️ Estoque insuficiente! Disponível: ${product.stock - inCartQty}`);
                        return;
                    }

                    if (existing) {
                        existing.quantity += qty;
                    } else {
                        cart.push({
                            id: product.id,
                            name: product.name,
                            price: product.price,
                            emoji: product.emoji,
                            quantity: qty,
                            maxStock: product.stock
                        });
                    }
                    updateCartUI();
                    showToast(`✅ ${qty}x "${product.name}" adicionado ao carrinho!`);
                    renderProducts();
                });
            });
        }

        // --- CART FUNCTIONS ---
        function removeFromCart(id) {
            const item = cart.find(p => p.id === id);
            cart = cart.filter(p => p.id !== id);
            updateCartUI();
            showToast(`🗑️ "${item?.name || 'Item'}" removido`);
            renderProducts();
        }

        function updateCartUI() {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.textContent = totalItems;
            cartItemsCountStat.textContent = totalItems;

            if (cart.length === 0) {
                cartItems.innerHTML = `<div class="cart-empty">🛒 Seu carrinho está vazio</div>`;
            } else {
                cartItems.innerHTML = cart.map(item => {
                    const subtotal = item.price * item.quantity;
                    return `
                        <div class="cart-item">
                            <div class="cart-item-info">
                                <span class="cart-item-name">${item.emoji} ${item.name}</span>
                                <div class="cart-item-detail">
                                    <span>${item.quantity}x</span>
                                    <span>R$ ${item.price.toFixed(2)}</span>
                                    <span style="color:#f5a623;">R$ ${subtotal.toFixed(2)}</span>
                                </div>
                            </div>
                            <button class="cart-item-remove" data-id="${item.id}">✕</button>
                        </div>
                    `;
                }).join('');
                document.querySelectorAll('.cart-item-remove').forEach(btn => {
                    btn.addEventListener('click', () => {
                        removeFromCart(parseInt(btn.dataset.id));
                    });
                });
            }

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            cartTotal.textContent = `R$ ${total.toFixed(2)}`;
            checkoutBtn.disabled = cart.length === 0;
        }

        // --- TOAST ---
        let toastTimeout;

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // --- CHECKOUT ---
        function checkout() {
            if (cart.length === 0) return;
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const items = cart.map(i => `${i.quantity}x ${i.name}`).join(', ');
            showToast(`🎉 Compra finalizada! ${totalItems} itens • Total: R$ ${total.toFixed(2)}`);
            cart = [];
            updateCartUI();
            renderProducts();
            closeCart();
        }

        // --- CART SIDEBAR ---
        function openCart() {
            cartSidebar.classList.add('open');
            overlay.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeCart() {
            cartSidebar.classList.remove('open');
            overlay.classList.remove('show');
            document.body.style.overflow = '';
        }

        // --- EVENTS ---
        cartToggle.addEventListener('click', openCart);
        cartClose.addEventListener('click', closeCart);
        overlay.addEventListener('click', closeCart);
        checkoutBtn.addEventListener('click', checkout);

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderProducts();
            });
        });

        function performSearch() {
            searchTerm = searchInput.value.trim();
            renderProducts();
        }
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') performSearch();
            if (searchInput.value.trim() === '') { searchTerm = ''; renderProducts(); }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && cartSidebar.classList.contains('open')) closeCart();
        });

        // --- INIT ---
        renderProducts();
        updateCartUI();
    </script>

</body>

</html>
